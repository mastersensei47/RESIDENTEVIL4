<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📺 TV en Vivo | MS47</title>
    <style>
        body { margin: 0; background: #0f0f0f; color: white; font-family: sans-serif; padding-bottom: 50px; }
        header { position: fixed; top: 0; width: 100%; background: #111; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; border-bottom: 2px solid #00bfff; z-index: 1000; }
        .volver { position: absolute; left: 20px; color: #00bfff; text-decoration: none; border: 1px solid #00bfff; padding: 5px 10px; border-radius: 5px; font-size: 14px; }
        .container { padding: 80px 20px 20px; max-width: 1200px; margin: auto; }
        h2 { border-left: 5px solid #00bfff; padding-left: 10px; margin: 30px 0 15px; font-size: 18px; text-transform: uppercase; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
        .card { background: #1b1b1b; border-radius: 10px; overflow: hidden; cursor: pointer; transition: 0.3s; border: 1px solid #333; text-align: center; }
        .card:hover { border-color: #00bfff; transform: scale(1.05); }
        .card img { width: 100%; height: 100px; object-fit: contain; background: white; padding: 10px; box-sizing: border-box; }
        .card h3 { font-size: 12px; padding: 10px; margin: 0; }

        /* PANEL ADMIN */
        #admin-trigger { position: fixed; bottom: 10px; right: 10px; width: 30px; height: 30px; cursor: pointer; z-index: 2000; opacity: 0.2; }
        #admin-panel { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1c1c1c; padding: 20px; border: 2px solid #00bfff; border-radius: 10px; z-index: 3000; width: 90%; max-width: 400px; box-shadow: 0 0 30px rgba(0,0,0,0.8); }
        #admin-panel input, #admin-panel select { width: 100%; padding: 10px; margin: 10px 0; background: #222; border: 1px solid #444; color: white; border-radius: 5px; box-sizing: border-box; }
        .btn-save { width: 100%; padding: 12px; background: #00bfff; border: none; color: black; font-weight: bold; cursor: pointer; border-radius: 5px; }
        .btn-cancel { width: 100%; padding: 8px; background: #333; border: none; color: white; margin-top: 10px; cursor: pointer; border-radius: 5px; }
        .loading { text-align: center; padding: 50px; color: #00bfff; }
    </style>
</head>
<body>

<header>
    <a href="categorias.html" class="volver">⬅ VOLVER</a>
    <span>📺 TV EN VIVO MS47</span>
</header>

<div class="container" id="main-content">
    <div id="status" class="loading">Sincronizando canales con MS47...</div>
</div>

<div id="admin-trigger" onclick="checkAdmin()"></div>

<div id="admin-panel">
    <h3 style="text-align:center; color:#00bfff; margin-top:0;">PANEL MS47</h3>
    <select id="f-cat">
        <option value="deportes">⚽ DEPORTES</option>
        <option value="cine">🎬 CINE Y SERIES</option>
        <option value="nacionales">🇦🇷 NACIONALES</option>
    </select>
    <input type="text" id="f-name" placeholder="Nombre (Ej: TyC Sports)">
    <input type="text" id="f-img" placeholder="URL Logo (PNG)">
    <input type="text" id="f-link" placeholder="URL de Transmisión">
    <input type="number" id="f-order" placeholder="Orden (1, 2, 3...)">
    <button class="btn-save" onclick="saveChannel()">GUARDAR EN LA NUBE</button>
    <button class="btn-cancel" onclick="document.getElementById('admin-panel').style.display='none'">CANCELAR</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set, push, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBjQB3yJdJPc44qvmge-H_961QJ1s_kh7E",
        authDomain: "tv-fulvo.firebaseapp.com",
        projectId: "tv-fulvo",
        storageBucket: "tv-fulvo.firebasestorage.app",
        messagingSenderId: "733955226142",
        appId: "1:733955226142:web:d49871efff59452b604c0f",
        databaseURL: "https://tv-fulvo-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // --- 1. CARGA AUTOMÁTICA DE CANALES VIEJOS ---
    async function initMS47() {
        const snap = await get(ref(db, 'canales'));
        if (!snap.exists()) {
            const inicial = {
                "ch1": { category: "deportes", name: "TyC Sports", img: "https://raw.githubusercontent.com/fede-navarro/logos-tv/main/tyc_sports.png", link: "https://dots.bestleague.world/cvatt.html?get=VHlDU3BvcnQ", order: 1 },
                "ch2": { category: "deportes", name: "TNT Sports Premium", img: "https://raw.githubusercontent.com/fede-navarro/logos-tv/main/tnt_sports.png", link: "https://bolaloca.my/player/3/75", order: 2 },
                "ch3": { category: "cine", name: "HBO", img: "https://raw.githubusercontent.com/fede-navarro/logos-tv/main/hbo.png", link: "https://dots.bestleague.world/cvatt.html?get=SEJPSEQ=", order: 3 }
            };
            await set(ref(db, 'canales'), inicial);
        }
    }
    initMS47();

    // --- 2. MOSTRAR CANALES EN TIEMPO REAL ---
    onValue(ref(db, 'canales'), (snapshot) => {
        const data = snapshot.val();
        const main = document.getElementById('main-content');
        main.innerHTML = "";

        if (!data) return;

        const cats = { deportes: "⚽ DEPORTES", cine: "🎬 CINE Y SERIES", nacionales: "🇦🇷 NACIONALES" };
        
        Object.keys(cats).forEach(key => {
            const filtrados = Object.values(data)
                .filter(c => c.category === key)
                .sort((a, b) => a.order - b.order);

            if (filtrados.length > 0) {
                main.innerHTML += `<h2>${cats[key]}</h2><div class="grid" id="grid-${key}"></div>`;
                const grid = document.getElementById(`grid-${key}`);
                filtrados.forEach(ch => {
                    grid.innerHTML += `
                        <div class="card" onclick="window.open('${ch.link}', '_blank')">
                            <img src="${ch.img}" onerror="this.src='https://via.placeholder.com/150?text=MS47'">
                            <h3>${ch.name}</h3>
                        </div>`;
                });
            }
        });
    });

    // --- 3. FUNCIONES DE ADMIN ---
    window.checkAdmin = () => {
        if(prompt("Contraseña Admin:") === "ms47admin") document.getElementById('admin-panel').style.display='block';
    };

    window.saveChannel = () => {
        const nuevo = {
            category: document.getElementById('f-cat').value,
            name: document.getElementById('f-name').value,
            img: document.getElementById('f-img').value,
            link: document.getElementById('f-link').value,
            order: parseInt(document.getElementById('f-order').value) || 99
        };

        if(!nuevo.name || !nuevo.link) return alert("Cargá nombre y link!");

        push(ref(db, 'canales'), nuevo).then(() => {
            alert("¡Canal Sincronizado!");
            document.getElementById('admin-panel').style.display='none';
        });
    };
</script>

</body>
</html>
