<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📺 TV en Vivo | MS47</title>
    <style>
        body { margin: 0; background: #0f0f0f; color: white; font-family: Arial, sans-serif; }
        header { position: fixed; top: 0; width: 100%; background: #111; padding: 15px; text-align: center; font-size: 22px; font-weight: bold; box-shadow: 0 2px 10px rgba(0,0,0,.6); z-index: 1000; }
        .volver { position: absolute; left: 15px; top: 18px; font-size: 14px; text-decoration: none; color: #00bfff; }
        .container { padding: 100px 20px 40px; max-width: 1300px; margin: auto; }
        h2 { border-left: 5px solid #00bfff; padding-left: 10px; margin: 30px 0 15px; text-transform: uppercase; font-size: 15px; color: #eee; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-bottom: 40px; }
        .card { background: #1b1b1b; border-radius: 8px; overflow: hidden; cursor: pointer; transition: .3s; border: 1px solid #333; display: flex; flex-direction: column; height: 140px; position: relative; }
        .card:hover { transform: scale(1.05); box-shadow: 0 0 15px #00bfff; border-color: #00bfff; }
        .card img { width: 100%; height: 95px; object-fit: contain; background: #fff; padding: 12px; box-sizing: border-box; }
        .card h3 { padding: 5px; font-size: 11px; margin: 0; background: #1b1b1b; color: #ddd; flex-grow: 1; display: flex; align-items: center; justify-content: center; text-align: center; }
        
        /* Panel de Administración */
        #admin-trigger { position: fixed; bottom: 0; right: 0; width: 30px; height: 30px; cursor: pointer; z-index: 9999; }
        #admin-panel { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #181818; padding: 25px; border: 2px solid #00bfff; z-index: 10000; width: 320px; border-radius: 12px; box-shadow: 0 0 30px rgba(0,0,0,0.8); }
        #admin-panel input { width: 100%; padding: 10px; margin: 8px 0; background: #222; border: 1px solid #444; color: white; border-radius: 5px; box-sizing: border-box; }
        #admin-panel button { width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-save { background: #00bfff; color: #000; }
        .btn-close { background: #444; color: #fff; }
    </style>
</head>
<body>

<header><a href="categorias.html" class="volver">⬅ Volver</a> 📺 TV EN VIVO MS47</header>

<div class="container">
    <h2 id="titulo-seccion">📡 TODOS LOS CANALES</h2>
    <div id="grid-canales" class="grid">
        </div>
</div>

<div id="admin-trigger" onclick="toggleAdmin()"></div>
<div id="admin-panel">
    <h3 style="margin: 0 0 15px 0; color: #00bfff;">Panel MS47 Master</h3>
    <input type="text" id="add-name" placeholder="Nombre del Canal (Ej: TyC Sports)">
    <input type="text" id="add-img" placeholder="URL de Imagen (PNG)">
    <input type="text" id="add-link" placeholder="URL del Stream (Link)">
    <button class="btn-save" onclick="saveChannel()">AGREGAR A LA NUBE</button>
    <button class="btn-close" onclick="toggleAdmin()">CERRAR</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, push, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBjQB3yJdJPc44qvmge-H_961QJ1s_kh7E",
        authDomain: "tv-fulvo.firebaseapp.com",
        projectId: "tv-fulvo",
        storageBucket: "tv-fulvo.firebasestorage.app",
        messagingSenderId: "733955226142",
        appId: "1:733955226142:web:d49871efff59452b604c0f",
        measurementId: "G-RG1HD4FSBK"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const grid = document.getElementById('grid-canales');

    // Cargar canales en tiempo real
    onValue(ref(db, 'canales'), (snapshot) => {
        const data = snapshot.val();
        grid.innerHTML = ""; 
        if (data) {
            Object.keys(data).forEach(key => {
                const ch = data[key];
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => window.open(ch.link, '_blank');
                card.innerHTML = `
                    <img src="${ch.img}" onerror="this.src='https://via.placeholder.com/150?text=Error+Link'">
                    <h3>${ch.name}</h3>
                `;
                grid.appendChild(card);
            });
        }
    });

    // Función para guardar (Global para el botón)
    window.saveChannel = function() {
        const name = document.getElementById('add-name').value;
        const img = document.getElementById('add-img').value;
        const link = document.getElementById('add-link').value;

        if (name && img && link) {
            const newRef = push(ref(db, 'canales'));
            set(newRef, { name, img, link }).then(() => {
                alert("Canal sincronizado en la nube.");
                document.getElementById('admin-panel').style.display = 'none';
                document.getElementById('add-name').value = "";
                document.getElementById('add-img').value = "";
                document.getElementById('add-link').value = "";
            });
        } else {
            alert("Completa todos los datos.");
        }
    };

    window.toggleAdmin = function() {
        const p = document.getElementById('admin-panel');
        p.style.display = p.style.display === 'block' ? 'none' : 'block';
    };
</script>

</body>
</html>
