<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📺 TV en Vivo | MS47</title>
    <style>
        body { margin: 0; background: #0f0f0f; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding-bottom: 50px; overflow-x: hidden; }
        header { position: fixed; top: 0; width: 100%; background: #111; padding: 15px; text-align: center; font-size: 22px; font-weight: bold; box-shadow: 0 2px 10px rgba(0,0,0,.8); z-index: 1000; display: flex; justify-content: center; align-items: center; }
        .volver { position: absolute; left: 20px; font-size: 14px; text-decoration: none; color: #00bfff; border: 1px solid #00bfff; padding: 5px 10px; border-radius: 5px; transition: 0.3s; }
        .volver:hover { background: #00bfff; color: #000; }
        .container { padding: 100px 20px 40px; max-width: 1400px; margin: auto; min-height: 80vh; }
        
        h2 { border-left: 5px solid #00bfff; padding-left: 15px; margin: 40px 0 20px; text-transform: uppercase; font-size: 18px; color: #fff; letter-spacing: 1px; display: flex; align-items: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; margin-bottom: 20px; }
        
        .card { background: #1b1b1b; border-radius: 10px; overflow: hidden; cursor: pointer; transition: transform 0.3s, box-shadow 0.3s; border: 1px solid #333; display: flex; flex-direction: column; height: 150px; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 5px 20px rgba(0, 191, 255, 0.4); border-color: #00bfff; }
        .card img { width: 100%; height: 100px; object-fit: contain; background: #fff; padding: 15px; box-sizing: border-box; }
        .card h3 { padding: 8px; font-size: 12px; margin: 0; background: #1b1b1b; color: #eee; flex-grow: 1; display: flex; align-items: center; justify-content: center; text-align: center; font-weight: 500; }
        
        /* ADMIN PANEL UI */
        #admin-trigger { position: fixed; bottom: 0; right: 0; width: 40px; height: 40px; cursor: pointer; z-index: 9999; }
        #admin-panel { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1c1c1c; padding: 25px; border: 2px solid #00bfff; z-index: 10000; width: 380px; max-height: 85vh; overflow-y: auto; border-radius: 15px; box-shadow: 0 0 50px rgba(0,0,0,0.9); }
        #admin-panel h3 { margin: 0 0 20px; color: #00bfff; text-align: center; border-bottom: 1px solid #333; padding-bottom: 10px; }
        #admin-panel label { font-size: 12px; color: #888; margin-left: 5px; }
        #admin-panel input, #admin-panel select { width: 100%; padding: 12px; margin: 5px 0 15px; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 8px; box-sizing: border-box; }
        #admin-panel button { width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-bottom: 10px; transition: 0.2s; }
        .btn-save { background: #00bfff; color: #000; }
        .btn-delete { background: #ff4444; color: #fff; display: none; }
        .btn-close { background: #333; color: #ccc; }
        
        .admin-list { margin-top: 20px; border-top: 1px solid #333; padding-top: 15px; }
        .admin-item { background: #252525; padding: 10px; margin-bottom: 8px; border-radius: 6px; font-size: 13px; cursor: pointer; display: flex; justify-content: space-between; border: 1px solid transparent; }
        .admin-item:hover { border-color: #00bfff; background: #333; }
        .loading { text-align: center; margin-top: 50px; font-size: 18px; color: #00bfff; }
    </style>
</head>
<body>

<header>
    <a href="categorias.html" class="volver">⬅ VOLVER</a> 
    <span>📺 TV EN VIVO MS47</span>
</header>

<div id="main-content" class="container">
    <div id="status" class="loading">Conectando con la nube...</div>
</div>

<div id="admin-trigger" onclick="authAdmin()"></div>

<div id="admin-panel">
    <h3>GESTIÓN DE CANALES</h3>
    <input type="hidden" id="edit-id">
    
    <label>Categoría</label>
    <select id="field-category">
        <option value="deportes">⚽ DEPORTES</option>
        <option value="cine">🎬 CINE Y SERIES</option>
        <option value="nacionales">🇦🇷 NACIONALES</option>
        <option value="documentales">🌿 DOCUMENTALES</option>
        <option value="infantiles">🧒 INFANTILES</option>
    </select>

    <label>Nombre del Canal</label>
    <input type="text" id="field-name" placeholder="Ej: ESPN Premium">
    
    <label>URL Logo (PNG preferente)</label>
    <input type="text" id="field-img" placeholder="https://...">
    
    <label>URL de Transmisión</label>
    <input type="text" id="field-link" placeholder="https://...">
    
    <label>Orden de aparición (Número)</label>
    <input type="number" id="field-order" value="0">

    <button class="btn-save" onclick="handleSave()">GUARDAR / ACTUALIZAR</button>
    <button id="btn-delete" class="btn-delete" onclick="handleDelete()">ELIMINAR CANAL</button>
    <button class="btn-close" onclick="closeAdmin()">CANCELAR</button>

    <div class="admin-list">
        <p style="font-size: 11px; color: #00bfff;">LISTADO (Toca para editar):</p>
        <div id="admin-items-container"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set, push, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBjQB3yJdJPc44qvmge-H_961QJ1s_kh7E",
        authDomain: "tv-fulvo.firebaseapp.com",
        projectId: "tv-fulvo",
        storageBucket: "tv-fulvo.firebasestorage.app",
        messagingSenderId: "733955226142",
        appId: "1:733955226142:web:d49871efff59452b604c0f",
        measurementId: "G-RG1HD4FSBK"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const PASS = "ms47admin";

    const cats = {
        deportes: { t: "⚽ DEPORTES", c: "#ff3131" },
        cine: { t: "🎬 CINE Y SERIES", c: "#00bfff" },
        nacionales: { t: "🇦🇷 NACIONALES", c: "#ffffff" },
        documentales: { t: "🌿 DOCUMENTALES", c: "#39ff14" },
        infantiles: { t: "🧒 INFANTILES", c: "#ffde59" }
    };

    // --- ESCUCHA DE DATOS ---
    onValue(ref(db, 'canales'), (snapshot) => {
        const data = snapshot.val();
        const main = document.getElementById('main-content');
        const adminList = document.getElementById('admin-items-container');
        
        main.innerHTML = "";
        adminList.innerHTML = "";
        document.getElementById('status').style.display = 'none';

        if (!data) {
            main.innerHTML = "<p style='text-align:center;'>No hay canales. Hacé clic abajo a la derecha para agregar.</p>";
            return;
        }

        // Procesar para la web
        const organized = {};
        Object.keys(cats).forEach(k => organized[k] = []);

        Object.keys(data).forEach(id => {
            const ch = data[id];
            if (organized[ch.category]) {
                organized[ch.category].push({ ...ch, id });
            }
            
            // Llenar lista del panel
            const item = document.createElement('div');
            item.className = 'admin-item';
            item.innerHTML = `<b>${ch.name}</b> <span>${ch.category}</span>`;
            item.onclick = () => loadToForm(id, ch);
            adminList.appendChild(item);
        });

        // Dibujar Secciones
        Object.keys(organized).forEach(key => {
            const list = organized[key].sort((a, b) => (a.order || 0) - (b.order || 0));
            if (list.length > 0) {
                const h2 = document.createElement('h2');
                h2.style.borderColor = cats[key].c;
                h2.innerText = cats[key].t;
                main.appendChild(h2);

                const grid = document.createElement('div');
                grid.className = 'grid';
                list.forEach(ch => {
                    grid.innerHTML += `
                        <div class="card" onclick="window.open('${ch.link}', '_blank')">
                            <img src="${ch.img}" onerror="this.src='https://via.placeholder.com/150?text=Logo+Error'">
                            <h3>${ch.name}</h3>
                        </div>`;
                });
                main.appendChild(grid);
            }
        });
    });

    // --- FUNCIONES ADMIN ---
    window.authAdmin = () => {
        if (prompt("Contraseña:") === PASS) document.getElementById('admin-panel').style.display = 'block';
    };

    window.closeAdmin = () => {
        document.getElementById('admin-panel').style.display = 'none';
        clearForm();
    };

    function loadToForm(id, ch) {
        document.getElementById('edit-id').value = id;
        document.getElementById('field-name').value = ch.name;
        document.getElementById('field-img').value = ch.img;
        document.getElementById('field-link').value = ch.link;
        document.getElementById('field-category').value = ch.category;
        document.getElementById('field-order').value = ch.order || 0;
        document.getElementById('btn-delete').style.display = 'block';
        document.getElementById('admin-panel').scrollTo(0,0);
    }

    function clearForm() {
        document.getElementById('edit-id').value = "";
        document.getElementById('field-name').value = "";
        document.getElementById('field-img').value = "";
        document.getElementById('field-link').value = "";
        document.getElementById('field-order').value = 0;
        document.getElementById('btn-delete').style.display = 'none';
    }

    window.handleSave = () => {
        const id = document.getElementById('edit-id').value;
        const payload = {
            name: document.getElementById('field-name').value,
            img: document.getElementById('field-img').value,
            link: document.getElementById('field-link').value,
            category: document.getElementById('field-category').value,
            order: parseInt(document.getElementById('field-order').value)
        };

        if (!payload.name || !payload.link) return alert("Nombre y Link obligatorios");

        const targetRef = id ? ref(db, `canales/${id}`) : push(ref(db, 'canales'));
        set(targetRef, payload).then(() => {
            alert("Guardado correctamente");
            clearForm();
        });
    };

    window.handleDelete = () => {
        const id = document.getElementById('edit-id').value;
        if (id && confirm("¿Eliminar este canal?")) {
            remove(ref(db, `canales/${id}`)).then(() => {
                alert("Eliminado");
                clearForm();
            });
        }
    };
</script>
</body>
</html>
